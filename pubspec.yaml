name: kiss_physical
description: >-
  A physically lit UI kit for Flutter: shader-drawn surfaces, materials and
  depth layers under one world light that follows how the device is held.
version: 0.1.0
homepage: https://wamf.github.io/kiss_physical/
repository: https://github.com/WAMF/kiss_physical
issue_tracker: https://github.com/WAMF/kiss_physical/issues
screenshots:
  - description: Showpiece materials with moss, flame, wear, growth, neon and liquid.
    path: screenshots/showpieces.jpg
  - description: Wood, marble, stone and metal textures under one light.
    path: screenshots/textures.jpg
  - description: The same controls in plastic, in brass on oak and in steel on marble.
    path: screenshots/controls.jpg
topics:
  - ui
  - widget
  - shader
  - design-system

platforms:
  android:
  ios:
  macos:
  web:

environment:
  sdk: ^3.6.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter
  kiss_color: ^0.6.0
  kiss_layout: ">=1.2.0 <4.0.0"
  native_device_orientation: ^2.1.3
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  very_good_analysis: ^7.0.0

flutter:
  shaders:
    - shaders/physical_dot_grid.frag
    - shaders/physical_effects.frag
    - shaders/physical_lens.frag
    - shaders/physical_marble.frag
    - shaders/physical_metal.frag
    - shaders/physical_pegboard.frag
    - shaders/physical_plain.frag
    - shaders/physical_plastic.frag
    - shaders/physical_stone.frag
    - shaders/physical_text_effects.frag
    - shaders/physical_text_marble.frag
    - shaders/physical_text_metal.frag
    - shaders/physical_text_plain.frag
    - shaders/physical_text_plastic.frag
    - shaders/physical_text_stone.frag
    - shaders/physical_text_wood.frag
    - shaders/physical_wood.frag

name: Publish to pub.dev

# Runs only when a version tag is pushed, never on a merge. pub.dev must
# have automated publishing from this repository enabled for the package,
# which can be done once its first version exists.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    permissions:
      id-token: write
    uses: dart-lang/setup-dart/.github/workflows/publish.yml@65eb853c7ba17dde3be364c3d2858773e7144260 # v1.7.2
